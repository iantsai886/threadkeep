[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: an AI app's settings file keeps its key order when Threadkeep adds its entry.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
