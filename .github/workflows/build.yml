# Builds Threadkeep on Windows, macOS and Linux, runs the tests, and builds the desktop installers.
# Manual only (Actions tab -> Build -> Run workflow): it never runs on its own.
# Results are UNSIGNED development builds. Signing for Windows and macOS needs certificates that
# only the account owner can supply; see docs/ARCHITECTURE.md.
name: Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The desktop crate's build script needs the interface and the command-line program to
      # exist, and on Linux its system libraries, so all of that comes before any cargo test.
      - name: Linux system libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Release build of the command-line program
        run: cargo build --release -p threadkeep
      - name: Rust tests
        run: cargo test --workspace
      - name: Tauri command-line tool
        run: cargo install tauri-cli --version "^2" --locked
      - name: Desktop installer (Windows)
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles nsis
      - name: Desktop installer (macOS)
        if: runner.os == 'macOS'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles dmg
      - name: Desktop installer (Linux)
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles deb
      - name: Command-line package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(./target/release/threadkeep version)
          NAME=Threadkeep-$VERSION-${{ matrix.name }}
          mkdir -p dist/$NAME
          cp target/release/threadkeep dist/$NAME/
          cp -R ui/dist dist/$NAME/ui
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          (cd dist && shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256)
      - name: Command-line package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: threadkeep-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
          if-no-files-found: error
